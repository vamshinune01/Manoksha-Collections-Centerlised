name: customer-web

on:
  pull_request:
    paths: ["manoksha-customer-web/**", "packages/**", "contracts/**", "package.json", "package-lock.json", ".github/workflows/customer-web.yml"]
  push:
    branches: [main]
    paths: ["manoksha-customer-web/**", "packages/**", "contracts/**", "package.json", "package-lock.json", ".github/workflows/customer-web.yml"]

concurrency:
  group: customer-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated API types match the committed contract
        run: npm run api-client:generate && git diff --exit-code packages/api-client/src/schema.d.ts
      - run: npm run customer:lint
      - run: npm run customer:typecheck
      - run: npm run customer:build
