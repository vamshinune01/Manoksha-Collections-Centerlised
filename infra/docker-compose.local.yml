# Local development dependencies only. Credentials here are for a throwaway local database, not secrets.
name: manoksha-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: manoksha
      POSTGRES_USER: manoksha
      POSTGRES_PASSWORD: manoksha_local
    ports:
      - "5433:5432"
    volumes:
      - manoksha-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manoksha -d manoksha"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  manoksha-pg:
